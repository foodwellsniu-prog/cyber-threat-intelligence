name: Deploy SENTINEL to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and validate CISA Known Exploited Vulnerabilities catalog
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "SENTINEL-public-threat-intel-dashboard/1.0"}
          )
          with urllib.request.urlopen(request, timeout=40) as response:
              raw = json.load(response)

          vulnerabilities = raw.get("vulnerabilities")
          if not isinstance(vulnerabilities, list) or not vulnerabilities:
              raise SystemExit("Feed validation failed: no vulnerabilities array returned.")
          if not all(isinstance(item, dict) and item.get("cveID") for item in vulnerabilities):
              raise SystemExit("Feed validation failed: malformed vulnerability entries.")

          output = {
              "source": "CISA Known Exploited Vulnerabilities Catalog",
              "sourceUrl": "https://www.cisa.gov/known-exploited-vulnerabilities-catalog",
              "feedUrl": url,
              "fetchedAt": datetime.now(timezone.utc).isoformat(),
              "dateReleased": raw.get("dateReleased"),
              "catalogVersion": raw.get("catalogVersion"),
              "count": len(vulnerabilities),
              "vulnerabilities": sorted(
                  vulnerabilities,
                  key=lambda item: item.get("dateAdded", ""),
                  reverse=True
              )[:250],
              "status": "success"
          }
          path = Path("data/kev.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(output, indent=2, ensure_ascii=False) + chr(10), encoding="utf-8")
          print(f"Validated {len(vulnerabilities)} CISA KEV records; prepared latest 250 for deployment.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
